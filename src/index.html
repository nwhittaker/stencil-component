<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>

    <script type="module" src="/build/stencil-component.esm.js"></script>
    <script nomodule src="/build/stencil-component.js"></script>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Visible</th>
          <th>Hidden</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <my-shadow-component visible>
              <p slot="content">My visible shadow component</p>
            </my-shadow-component>
          </td>
          <td>
            <my-shadow-component>
              <p slot="content">My hidden shadow component</p>
            </my-shadow-component>
          </td>
        </tr>
        <tr>
          <td>
            <my-scoped-component visible>
              <p slot="content">My visible scoped component</p>
            </my-scoped-component>
          </td>
          <td>
            <my-scoped-component>
              <p slot="content">My hidden scoped component</p>
            </my-scoped-component>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
